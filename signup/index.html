<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f8">
  <title>Sign up — Daybook</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../auth-page.js" type="module"></script>
</head>
<body data-page="signup">
  <main class="auth-main">
    <a class="brand" href="../">Daybook</a>
    <h1>Sign up</h1>
    <p>Create an account to save your plans.</p>
    <div id="storage-error" class="error-banner" role="alert" hidden></div>
    <div id="complete-signup" hidden>
      <p>Your account is ready to set up. Continue to start using Daybook.</p>
      <button id="finish-signup" class="button button-primary" type="button">Complete sign up</button>
      <button id="cancel-signup" class="text-button" type="button">Use a different account</button>
    </div>
    <div id="signup-options">
      <form id="auth-form" class="form-panel">
        <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
        <button class="button button-primary" type="submit" disabled>Sign up</button>
      </form>
      <p class="auth-separator">or</p>
      <button id="google-auth" class="button" type="button" disabled>Continue with Google</button>
      <p class="auth-switch">Already have an account? <a href="../signin/">Sign in</a></p>
    </div>
  </main>
</body>
</html>
