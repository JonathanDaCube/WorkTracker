<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f8">
  <title>Sign in — Daybook</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../auth-page.js" type="module"></script>
</head>
<body data-page="signin">
  <main class="auth-main">
    <a class="brand" href="../">Daybook</a>
    <h1>Sign in</h1>
    <p>Sign in to see your plans.</p>
    <div id="storage-error" class="error-banner" role="alert" hidden></div>
    <form id="auth-form" class="form-panel">
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button button-primary" type="submit" disabled>Sign in</button>
    </form>
    <p class="auth-separator">or</p>
    <button id="google-auth" class="button" type="button" disabled>Continue with Google</button>
    <p class="auth-switch">Don't have an account? <a href="../signup/">Sign up</a></p>
  </main>
</body>
</html>
