<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f8">
  <title>Daybook</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" type="module"></script>
</head>
<body data-page="home">
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="./">Daybook</a>
      <nav class="navigation" aria-label="Main navigation">
        <a href="./" class="nav-link active" aria-current="page">Overview</a>
        <a href="./newItem/" class="nav-link">Add a plan</a>
        <a href="./settings/" class="nav-link">Settings</a>
      </nav>
      <p class="storage-note" id="account"></p>
      <button class="text-button" id="signout" type="button">Sign out</button>
      <div class="theme-setting">
        <label for="theme">Appearance</label>
        <select id="theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </aside>

    <main class="main">
      <div id="storage-error" class="error-banner" role="alert" hidden></div>

      <section id="home-page" class="page">
        <header class="page-heading">
          <div><h1>Overview</h1><p>Keep track of your upcoming assignments and events.</p></div>
          <a href="./newItem/" class="button button-primary">Add a plan</a>
        </header>

        <div class="summary-strip">
          <div><strong id="upcoming-count">0</strong><span>Upcoming plans</span></div>
          <div><strong id="assignment-count">0</strong><span>Assignments</span></div>
          <div><strong id="event-count">0</strong><span>Events</span></div>
        </div>

        <div class="dashboard-grid">
          <section class="panel upcoming-panel" aria-labelledby="upcoming-title">
            <h2 id="upcoming-title">Upcoming plans</h2>
            <p class="panel-description">Your upcoming assignments and events.</p>
            <div id="upcoming-list" class="upcoming-list"></div>
          </section>

          <section class="panel calendar-panel" aria-labelledby="calendar-title">
            <h2 id="calendar-title">Calendar</h2>
            <p class="panel-description">Select a day to see its plans.</p>
            <div class="calendar">
              <div class="calendar-toolbar"><h3 id="calendar-month"></h3><div class="calendar-controls"><button id="previous-month" type="button" aria-label="Previous month">‹</button><button id="next-month" type="button" aria-label="Next month">›</button></div></div>
              <div class="weekdays" aria-hidden="true"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div>
              <div id="calendar-grid" class="calendar-grid" aria-label="Calendar days"></div>
              <div class="calendar-legend"><span><i class="legend-dot assignment-dot"></i> Assignment</span><span><i class="legend-dot event-dot"></i> Event</span></div>
            </div>
            <div class="day-detail"><h3 id="selected-date"></h3><div id="day-list"></div></div>
          </section>
        </div>
      </section>

      <div id="announcement" class="sr-only" aria-live="polite"></div>
    </main>
  </div>
</body>
</html>
